[project]
os = "host"
arch = "host"
name = "yh"
version = "0.0.11"
source = "."

# CLI-R（2026-10-27）：命令行解析用 libs/cli，作为显式跨项目依赖
# （不依赖「可执行文件旁边有 libs」的默认标准库搜索）。
[dependencies]
libs = {path = "../libs"}

# 自举链接全部由 [link-*] 清单提供（桥 + 静态 LLVM/lld + CRT），
# 不再编译 bridge_stub.c：该桩只为「无固定 LLVM 包」的旧路径保留，
# Windows 上它的弱符号还会与静态 CRT/桥冲突。

