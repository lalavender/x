[project]
os = "host"
arch = "host"
name = "yh"
version = "0.0.13"
source = "."

# 闭包根：默认仓库 tmp/llvm-migration（相对本清单）；构建机可导出同名环境变量
# 覆盖（justfile 已导出，见 cache_root）。这样新 worktree 不再需要 tmp 软链。
[env]
YH_ROOT="../"
YH_LLVM_ROOT = "${YH_ROOT}/tmp/llvm-migration"

[dependencies]
libs = {path = "../libs"}

# 自举链接全部由 [link-*] 清单提供（桥 + 静态 LLVM/lld + CRT），
# 不再编译 bridge_stub.c：该桩只为「无固定 LLVM 包」的旧路径保留，
# Windows 上它的弱符号还会与静态 CRT/桥冲突。

# BEGIN LINK-CLOSURE (generated by tools/link-closure.py)
[link-darwin-arm64]
bridge = [
  "${YH_LLVM_ROOT}/llvm-host-darwin-aarch64/libyh-llvm-bridge.a",
]
