# Windows 闭包（W2-2）：归档由 tools/llvm-windows-closure.py 在本机构建/复制，
# 因此这一节**不在**上面 link-closure.py 的生成块里——那个块只重写 darwin/linux
# 四个宿主，windows 节留在块内会被任何一次 `tools/link-closure.py update` 静默删掉。
# 路径是相对 compiler/ 的 canonical 形式（与 Darwin/Linux 节一致）；成员由
# 本机 MSVC 构建产物与 VS/SDK 安装决定，改成员请同时改 tools/llvm-windows-closure.py。
