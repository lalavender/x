name: ci
# 分支门（GitHub Actions 托管 runner，原生四端 + Linux 双架构，无容器）。
#
# 平台矩阵（2026-11-03 迁移）：
#   linux-x64    ubuntu-24.04       Linux/x86_64 原生
#   linux-arm64  ubuntu-24.04-arm   Linux/AArch64 原生（含 Windows 目标编译侧门）
#   darwin-arm64 macos-15           Darwin/ARM64 原生
#   windows-x64  windows-2022       Windows/x86_64 原生
#
# 门禁只有一份定义：`just ci-gate`（test 三层 → 平台专项门 → 自举两代固定点）。
# 本文件只做平台编排：runner、系统依赖、种子、闭包缓存；release.yml 的四个平台
# job 调同一个 ci-gate 再打包，因此两个 workflow 不会再各维护一套门禁清单。
# 新增测试或调整门禁 → 改 justfile 的 ci-gate / platform_gate，不要改 YAML。
#
# 闭包策略（用户决定：闭包不上传 Release，由 CI 机器自行准备）：
#   Linux   从 vendor/llvm/sdk.lock.json 的 Ubuntu deb 取静态 LLVM/lld（分钟级）；
#   Darwin  源码构建 LLVM 21.1.8（首次 1–2 小时，actions/cache 复用）；
#   Windows 源码 MSVC /MT 构建静态 LLVM/lld（首次 2–3 小时，actions/cache 复用）。
# Windows 种子来自最新 Release（0.0.12 起由 release.yml 正常产出）。
# 四端直接 `just build` 冷编：种子（≥0.0.12）已认识 `windows` comptime 标记、
# `*.windows.*.yh` 平台变体与 `.test.yh` 测试文件排序，过渡期自举桥已删除。
#
# 触发：push 到 llvm/main/arm64 分支；PR；手动。
# 版本分支（<ver>-rc/<ver>-release）已于 2026-11-06 随单主线切换删除。
# tag 发布见 release.yml。
# ANTLR 参考语法门只在本机跑（just test / just quick）：它要 Java + 本机 antlr
# 运行时，runner 没有，所以这里显式 YH_ANTLR=0。
on:
  push:
    branches:
      - llvm
      - main
      - arm64
  pull_request:
    branches:
      - llvm
      - main
      - arm64
      # 开发主线只有 llvm；main/arm64 是遗留分支，删除前保留触发。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支的 push 与 PR 共用一个组：连续 push 只保留最新运行，
  # 旧运行会被取消（GitHub 历史里仍会留下 cancelled 记录；事件本身无法合并）。
  # 手动 dispatch 用独立组，避免长闭包排查被新 push 取消。
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  LLVM_JOBS: "2"
  # 参考语法层需要 Java + antlr venv；CI 用编译器的 --syntax-check 覆盖语法面。
  YH_ANTLR: "0"

jobs:
  linux-x64:
    # 固定 24.04：ubuntu-latest 已滚到 26.04（libxml2 SONAME 变了，0.0.11 种子跑不起来；
    # 26.04 的 gcc15/gnu23 还会把 C 侧 strtol 重定向到 glibc 的 C23 变体，libs 的
    # C ABI 用例会红——所以不要改用 ubuntu-latest）。
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 安装构建依赖
        # libxml2/zlib/zstd：种子与内嵌宿主按动态库链接，缺 runtime 会 127。
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential binutils libxml2-dev zlib1g-dev libzstd-dev
      - name: 取种子
        run: python3 tools/fetch-release-seed.py --platform linux-x86_64
      - name: 准备闭包
        run: just llvm-host
      - name: 门禁（test + test-llvm + 自举固定点）
        run: just ci-gate

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 安装构建依赖（含 Windows 目标门所需的 llvm-18 工具）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential binutils clang llvm-18 lld-18 \
            libxml2-dev zlib1g-dev libzstd-dev
          # 编译器自身用内嵌 lld；这里只需要 def→lib 与导入面核对工具。
          # llvm-ar/llvm-lib 也被门禁脚本按无后缀名查找（noble 只给 -18 后缀名）。
          for tool in llvm-dlltool llvm-readobj llvm-nm llvm-ar llvm-lib lld-link; do
            if [ -x "/usr/bin/$tool-18" ]; then sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"; fi
          done
      - name: 取种子
        run: python3 tools/fetch-release-seed.py --platform linux-arm64
      - name: 准备闭包
        run: just llvm-host
      - name: 门禁（test + Windows 目标编译侧 + 自举固定点）
        run: just ci-gate

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 取种子
        run: python3 tools/fetch-release-seed.py --platform darwin-arm64
      - name: 恢复 Darwin 闭包缓存
        id: closure-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/llvm-migration
          # 只按构建器与桥源码分键：sdk.lock.json/身份记录变化时 just llvm-host
          # 的 check 会自行判定失效并重建（缓存键不承担正确性，只承担命中率）。
          key: llvm-darwin-${{ hashFiles('tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}
          restore-keys: |
            llvm-darwin-
      - name: 准备 Darwin 闭包（缓存未命中时源码构建 LLVM）
        run: just llvm-host
      - name: 保存 Darwin 闭包缓存
        if: success() && steps.closure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/llvm-migration
          key: ${{ steps.closure-cache.outputs.cache-primary-key }}
      - name: 门禁（test + test-llvm-darwin + 自举固定点）
        run: just ci-gate

  windows-x64:
    # pin 2022：windows-latest 已滚到 VS 18 镜像，闭包 CMake 生成器写死的
    # 「Visual Studio 17 2022」找不到匹配实例（长期方案：生成器动态检测）。
    # release.yml 用同一个 pin，两边必须一致。
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 取种子（最新带 Windows 资产的 Release）
        run: python tools/fetch-release-seed.py --platform windows-x64
      - name: 恢复 Windows 闭包缓存
        id: closure-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/llvm-migration/windows-llvm-closure
            tmp/llvm-migration/llvm-host-windows-x86_64
            tmp/llvm-migration/windows-sdk
          key: llvm-windows-${{ hashFiles('tools/llvm-windows-closure.py', 'tools/llvm-windows-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/windows_shim.c', 'compiler/project.toml') }}
          restore-keys: |
            llvm-windows-
      - name: 准备 Windows 闭包（缓存未命中时 MSVC 源码构建 LLVM/lld）
        run: just llvm-host
      - name: 保存 Windows 闭包缓存
        if: success() && steps.closure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/llvm-migration/windows-llvm-closure
            tmp/llvm-migration/llvm-host-windows-x86_64
            tmp/llvm-migration/windows-sdk
          key: ${{ steps.closure-cache.outputs.cache-primary-key }}
      - name: 门禁（test + Windows 语料交叉编译/执行 + 自举固定点）
        run: just ci-gate
