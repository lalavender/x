name: CI

# 自举门禁的多平台验证（普通提交）：
#  - 三个作业都从最近一个已发布 Release 下载对应平台 `yh` 资产作种子；
#  - linux-arm64：QEMU 容器内跑语法/运行语料与自举主门；
#  - linux-x86_64：原生 x64 Release 种子，跑 LLVM 全量测试与自举；
#  - darwin-arm64：macOS Release 种子，跑 Darwin LLVM 专项、连续自举与主门；
#  - tag 推送不在这里跑：Release 工作流负责三端完整测试并发布新 Release。
# 触发：手动 workflow_dispatch（可选平台）或推送分支。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 验证范围
        type: choice
        default: all
        options:
          - all
          - linux-arm64
          - linux-x86_64
          - darwin-arm64
  push:
    branches: [arm64, llvm, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: true

jobs:
  antlr:
    name: ANTLR 语法参考门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Java 与 ANTLR 4.13.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless python3-pip curl
          bash tools/run-antlr-ci.sh --quiet

  linux-arm64:
    name: AArch64 Linux（ELF）LLVM 主门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-arm64'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 每次提交都用上一版 Release 的 linux-arm64 资产作种子；首次发布或
      # 找不到 Release 时脚本会退回仓库内已有种子（LFS 已拉取）。
      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/fetch-release-seed.py --platform linux-arm64 --dest bin/yh-linux-arm64

      # 免费私有仓库没有 arm64 原生 runner；用 QEMU 在 x86_64 runner 上跑
      # arm64 容器，产物是货真价实的 AArch64 Linux ELF。
      - name: 缓存固定 arm64 LLVM/lld 宿主
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-host-linux-arm64-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-sdk.py', 'tools/llvm-host.py', 'tests/selfhost/llvm-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/lld_stub.cpp') }}

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 语法/运行语料与主门（容器内）
        run: |
          docker run --rm --platform linux/arm64 \
            -e YH_LLVM_HOST=1 \
            -v "$PWD":/repo:ro \
            ubuntu:24.04 bash -ec '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq build-essential python3 binutils xz-utils libxml2-dev >/dev/null
              cp -r /repo /build
              cd /build
              # 仓库根的 yh 是 gitignore 的本地产物，检出里没有。首次 make
              # 准备固定 arm64 LLVM/lld 宿主（缓存 tmp/llvm-migration）；之后
              # 默认后端为 LLVM，最终链接走内嵌 lld，C 源编译仍用 arm64 gcc。
              make
              make test-llvm-linux-arm64
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
              make selfhost-native
            '

  linux-x86_64:
    name: x86_64 Linux（ELF）LLVM 全门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEED: bin/yh-linux-x64
      YH_LINK: /nonexistent
      LLVM_JOBS: "2"
      # 全新 runner 上 auto 不联网；require 允许首次取固定 SDK，之后走缓存。
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4

      # 固定 SDK 与 llvm-host 产物缓存在 tmp/llvm-migration（数 GB）；
      # 键随 SDK 锁文件、构建脚本与桥源码变化，命中后 llvm-host 离线可用。
      - name: 缓存固定 LLVM SDK
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-host-${{ runner.os }}-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-sdk.py', 'tools/llvm-host.py', 'tests/selfhost/llvm-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/lld_stub.cpp') }}

      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/fetch-release-seed.py --platform linux-x86_64 --dest bin/yh-linux-x64

      - name: LLVM x64 全量语料与原生自举门
        run: |
          make
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
          make selfhost-native

  darwin-arm64:
    name: Darwin arm64（Mach-O）主门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'darwin-arm64'
    runs-on: macos-14          # Apple Silicon（arm64）；macos-13 是 x86_64，跑不了 arm64 种子
    timeout-minutes: 120
    env:
      SEED: bin/yh-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      # 编译器自举仍会用 Apple clang 编译 C 源（bridge_stub.c 等），
      # 需要 Xcode SDK 头文件；用户程序链接则由 compiler/darwin-sdk 覆盖。
      - name: 选择 Xcode macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/fetch-release-seed.py --platform darwin-arm64 --dest bin/yh-darwin-arm64

      - name: 恢复 Darwin LLVM 源码 SDK 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            tmp/llvm-migration/darwin-sdk/llvm-project-21.1.8.src.tar.xz
            tmp/llvm-migration/darwin-sdk/source-llvm-project-21.1.8.src
            tmp/llvm-migration/darwin-sdk/build-llvm-project-21.1.8
            tmp/llvm-migration/darwin-sdk/sdk-darwin-aarch64
          key: llvm-darwin-sdk-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py') }}

      - name: 恢复 Darwin 静态桥缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration/llvm-host-darwin-aarch64
          key: llvm-darwin-host-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}


      - name: 构建并静态接入 Darwin LLVM
        env:
          YH_LLVM_HOST: "1"
          LLVM_JOBS: "2"
        run: make

      - name: Darwin 固定 SDK、桥 ABI 与 Mach-O lld 门
        run: make test-llvm-darwin

      # F2-8：从入库种子 legacy 编 A，A 以 LLVM 连续编 B/C/D；O0/O2 固定点、
      # 自解析、全量语料、Darwin 专项门与隔离 PATH。手动触发，不自动滚种子。
      - name: 原生连续自举（F2-8）
        env:
          LLVM_JOBS: "2"
        run: make selfhost-llvm-darwin

      - name: 上传 F2-8 自举证据
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-f2-8-selfhost
          path: |
            tmp/f2-8/selfhost-*/stats.json
            tmp/f2-8/selfhost-*/logs
            tmp/f2-8/selfhost-*/snapshots
          if-no-files-found: error

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 主门（固定点 + 自解析 + 语料 + 模块/项目验收）
        run: |
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
          make selfhost-native
