name: CI

# 自举门禁的多平台验证：
#  - linux-arm64：QEMU 容器内（arm64 原生仿真）跑编译器语法模式、运行语料与主门；
#  - linux-x86_64：ARM64 种子经 QEMU 生成 x64 A，随后以原生 x64 运行 LLVM O0/O2 全门；
#    第 1 层 ANTLR 语料需要 Java 与 antlr4 jar 缓存，不在 CI 里跑（本机门禁仍覆盖）。
#    固定 SDK 经 YH_LLVM_HOST=1 联网准备（auto 模式在全新 runner 上不下载，
#    构建出的 yh 没有 LLVM 桥会让 test-llvm 失败），SDK 缓存在 tmp/llvm-migration。
#  - darwin-arm64：macOS（Apple Silicon）上跑同一套门禁；入库 bin/yh-darwin-arm64 若落后于
#    「模块私有类型」一代，先自动补一代种子再验证（见下方步骤注释）。
# 触发：手动 workflow_dispatch（可选只跑某个平台，省 macOS 计费分钟）或推送分支。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 验证范围
        type: choice
        default: all
        options:
          - all
          - linux-arm64
          - linux-x86_64
          - darwin-arm64
  push:
    branches: [arm64, llvm, main]
    tags: ['0.0.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: AArch64 Linux（ELF）主门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-arm64'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 免费私有仓库没有 arm64 原生 runner；用 QEMU 在 x86_64 runner 上跑
      # arm64 容器，产物是货真价实的 AArch64 Linux ELF。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 语法/运行语料与主门（容器内）
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/repo:ro \
            ubuntu:24.04 bash -ec '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq build-essential python3 >/dev/null
              cp -r /repo /build
              cd /build
              # 仓库根的 yh/yh_link/yh_asm 是 gitignore 的本地产物，检出里没有，
              # 汇编与链接自然回落容器内的系统 gcc（arm64 原生）。
              make
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
              make selfhost-native
              # TC4 arm64 原生验证：链接器端到端验收 + GNU ld 差分（FULL=1）。
              # check.py 自行冷编 link/ 与 asm/（端到端缺 yh_asm 时自动补建），
              # arm64 容器即原生执行环境——把 WSL/qemu 的「模拟通过」提升为
              # CI 原生通过（todo.md「TC4 的剩余项：arm64 原生验证」）。
              make yh-link-probe FULL=1
            '

  linux-x86_64:
    name: x86_64 Linux（ELF）LLVM 全门
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEED: bin/yh-linux-arm64
      YH_LINK: /nonexistent
      # 交叉 libc 的 loader 不在宿主的 /lib；qemu-user 用该前缀解析
      # /lib/ld-linux-aarch64.so.1 与 /lib/aarch64-linux-gnu。
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      # require 模式：全新 runner 上没有固定 SDK，auto 不联网会让构建回落旧路径
      # （yh 无 LLVM 桥），test-llvm/selfhost-llvm 必失败。联网取一次后有缓存。
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4

      # 固定 SDK 与 llvm-host 产物缓存在 tmp/llvm-migration（数 GB）；
      # 键随 SDK 锁文件、构建脚本与桥源码变化，命中后 llvm-host 离线可用。
      - name: 缓存固定 LLVM SDK
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-host-${{ runner.os }}-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-sdk.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/lld_stub.cpp') }}

      # 过渡种子仍是 AArch64：QEMU 只用于生成 x64 候选 A；B/C/D 由自举门原生运行。
      - name: 准备 AArch64 执行与交叉链接工具
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 安装工具并配置 AArch64 链接器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-aarch64-linux-gnu python3
          # qemu-user 的 -L 前缀会映射 /lib/aarch64-linux-gnu；交叉 libc 实际
          # 位于 /usr/aarch64-linux-gnu/lib，补一个目录内自引用。
          sudo ln -sfn . /usr/aarch64-linux-gnu/lib/aarch64-linux-gnu
          mkdir -p "$RUNNER_TEMP/yh-crossbin"
          cat > "$RUNNER_TEMP/yh-crossbin/gcc" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-gcc "$@"
          EOF
          chmod +x "$RUNNER_TEMP/yh-crossbin/gcc"
          echo "$RUNNER_TEMP/yh-crossbin" >> "$GITHUB_PATH"

      - name: LLVM x64 语料与 A→B/C/D 原生自举门
        run: |
          # 种子是 arm64，root `make` 会按宿主种子构建 arm64 yh；x64 A/B/C/D
          # 由 llvm-selfhost.py 用 seed-build 显式产 x64，并在最终 D 上跑全门。
          make selfhost-llvm LLVM_JOBS=2

  darwin-arm64:
    name: Darwin arm64（Mach-O）主门
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'darwin-arm64')
    runs-on: macos-14          # Apple Silicon（arm64）；macos-13 是 x86_64，跑不了 arm64 种子
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 Darwin LLVM 源码 SDK 构建缓存
        uses: actions/cache@v4
        with:
          path: |
            tmp/llvm-migration/darwin-sdk/llvm-project-21.1.8.src.tar.xz
            tmp/llvm-migration/darwin-sdk/source-llvm-project-21.1.8.src
            tmp/llvm-migration/darwin-sdk/build-llvm-project-21.1.8
            tmp/llvm-migration/darwin-sdk/sdk-darwin-aarch64
          key: llvm-darwin-sdk-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py') }}

      - name: 恢复 Darwin 静态桥缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration/llvm-host-darwin-aarch64
          key: llvm-darwin-host-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}

      # 保险步骤：入库种子若落后于当前源码，先补一代再构建。
      # 种子已按「yh-平台-架构」命名（darwin/arm64 → bin/yh-darwin-arm64）；
      # 当前入库种子就是 HEAD 源码编出的，本步骤会直接跳过。
      - name: 必要时补一代 macOS 种子
        env:
          YH_LLVM_HOST: "0"
        run: |
          set -euo pipefail
          cat > /tmp/bare.yh <<'EOF'
          struct S { v int; }
          fn main() int { let s S; s.v = 1; return s.v - 1; }
          EOF
          if bin/yh-darwin-arm64 --syntax-check /tmp/bare.yh >/dev/null 2>&1; then
            echo "入库种子已支持模块私有类型，无需中间代"
            exit 0
          fi
          echo "入库种子落后一代：造「语言规则一代」（类型临时恢复 pub）"
          python3 - <<'PY'
          import pathlib
          import sys

          TARGETS = [
              ("compiler/ast/ast_expr.yh", "AstExpr"),
              ("compiler/ast/ast_function.yh", "AstFunctionContext"),
              ("compiler/ast/ast_ir_build.yh", "AstIRBuilder"),
              ("compiler/ast/ast_ir_inline.yh", "AstIRInlineEntry"),
              ("compiler/ast/ast_stmt.yh", "AstStmt"),
              ("compiler/cmd/toml.yh", "TomlArrayItem"),
              ("compiler/cmd/toml.yh", "TomlSec"),
              ("compiler/cmd/project.yh", "PJDirEntry"),
              ("compiler/cmd/clock.darwin.yh", "CmdTimespec"),
              ("compiler/cmd/clock.linux.arm64.yh", "CmdTimespec"),
              ("compiler/comptime/ct_ir_data.yh", "CtDataSlice"),
              ("compiler/comptime/ct_global_agg.yh", "CtGlobalAgg"),
              ("compiler/parse/iface_ct_map.yh", "IfaceCtColMap"),
          ]
          done = 0
          for rel, name in TARGETS:
              path = pathlib.Path(rel)
              # newline="" 按字节保留行尾，避免在 CRLF 检出上重写整文件
              text = path.read_text(encoding="utf-8", newline="")
              old = "struct " + name + " "
              new = "pub struct " + name + " "
              hits = text.count("\n" + old)
              if hits != 1:
                  sys.exit(f"{rel}: {name} 命中 {hits} 处，期望 1 处")
              path.write_text(text.replace("\n" + old, "\n" + new),
                              encoding="utf-8", newline="")
              done += 1
          print(f"已临时恢复 {done} 处类型的 pub")
          PY
          make
          make seed
          git checkout -- compiler
          python3 tools/selfhost_snapshot_gate.py --verify-seed "$PWD/bin/yh-darwin-arm64"
          echo "中间代种子已就位（bin/yh-darwin-arm64 与 .sha256 已更新）"

      - name: 构建并静态接入 Darwin LLVM
        env:
          YH_LLVM_HOST: "1"
          LLVM_JOBS: "2"
        run: make

      - name: Darwin 固定 SDK、桥 ABI 与 Mach-O lld 门
        run: make test-llvm-darwin

      # F2-8：从入库种子 legacy 编 A，A 以 LLVM 连续编 B/C/D；O0/O2 固定点、
      # 自解析、全量语料、Darwin 专项门与隔离 PATH。手动触发，不自动滚种子。
      - name: 原生连续自举（F2-8）
        env:
          LLVM_JOBS: "2"
        run: make selfhost-llvm-darwin

      - name: 上传 F2-8 自举证据
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-f2-8-selfhost
          path: |
            tmp/f2-8/selfhost-*/stats.json
            tmp/f2-8/selfhost-*/logs
            tmp/f2-8/selfhost-*/snapshots
          if-no-files-found: error

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 主门（固定点 + 自解析 + 语料 + 模块/项目验收）
        run: make selfhost-native

      - name: 校验入库种子
        run: |
          file bin/yh-darwin-arm64
          python3 tools/selfhost_snapshot_gate.py --verify-seed "$PWD/bin/yh-darwin-arm64"

      - name: 上传 macOS 种子（如已补代，下载后提交回仓库）
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-seed
          path: |
            bin/yh-darwin-arm64
            bin/yh-darwin-arm64.sha256
          if-no-files-found: error
