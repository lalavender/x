name: Release

# 滚动自举发布：编译器就是 yh，由上一版 Release 的同平台二进制编译当前源码。
#  - tag 推送：三个平台都从上一版 Release 取种子，跑完整测试/自举，再发布新 Release；
#  - linux-arm64：QEMU 容器内构建、语料与自举主门；
#  - linux-x86_64：原生 x64 Release 种子，LLVM 全量测试与自举；
#  - darwin-arm64：macOS Release 种子，Darwin 专项、连续自举与主门；
#  - release 作业：等三端全部通过后归档 tar.gz + sha256（下一版的种子）。
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要归档的 tag（例如 0.0.5）
        required: true
        default: 0.0.5
      x64_only:
        description: 只构建 linux-x86_64，并补到已有 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  antlr:
    name: ANTLR 语法参考门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 准备 Java 与 ANTLR 4.13.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless python3-pip curl
          bash tools/run-antlr-ci.sh --quiet

  linux-arm64:
    name: 构建 AArch64 Linux（ELF）
    if: ${{ github.event_name == 'push' || inputs.x64_only == false || inputs.x64_only == 'false' }}
    runs-on: ubuntu-latest
    env:
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      YHL_SEED_EXCLUDE: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          lfs: true

      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/fetch-release-seed.py --platform linux-arm64 \
            --dest bin/yh-linux-arm64 --exclude-tag "${YHL_SEED_EXCLUDE}"

      # 免费私有仓库没有 arm64 原生 runner，用 QEMU 在 x86_64 runner 上
      # 仿真 arm64 容器；产物是货真价实的 AArch64 Linux ELF。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 容器内 make 与冒烟（ubuntu:24.04）
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/repo:ro \
            -v "$PWD/out":/out \
            -v /tmp/smoke.yh:/smoke.yh:ro \
            ubuntu:24.04 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              # Makefile 的 verify-seed / seed-build.py 都要 python3，只装
              # build-essential 会让 make 以 127 失败（2026-10-13 0.0.4 首跑踩到）
              apt-get install -y -qq build-essential python3 >/dev/null
              cp -r /repo /build
              cd /build
              # 种子是刚下载的上一版 Release linux-arm64 资产。
              make
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
              make selfhost-native
              # 开箱状态冒烟（链接走容器内系统 gcc）
              ./yh /smoke.yh -o /tmp/smoke && /tmp/smoke
              # 两个产物都在容器内写入（容器是 root，外层步骤对 root 所有的
              # out/ 目录没有写权限，只读打包）
              cp yh /out/
                          '

      - name: 打包
        run: |
          file out/yh
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-linux-arm64.tar.gz" -C out yh
          sha256sum "yh-${TAG}-linux-arm64.tar.gz" > "yh-${TAG}-linux-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            yh-*-linux-arm64.tar.gz
            yh-*-linux-arm64.sha256

  linux-x86_64:
    name: 构建 x86_64 Linux（ELF）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEED: bin/yh-linux-x64
      YH_LLVM_HOST: "1"
      YH_LINK: /nonexistent
      LLVM_JOBS: "2"
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      YHL_SEED_EXCLUDE: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 与 ci.yml x64 作业同键；命中后固定 SDK 可离线使用。
      - name: 恢复固定 LLVM SDK 缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-host-${{ runner.os }}-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-sdk.py', 'tools/llvm-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/lld_stub.cpp') }}

      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/fetch-release-seed.py --platform linux-x86_64 \
            --dest bin/yh-linux-x64 --exclude-tag "${YHL_SEED_EXCLUDE}"

      - name: 完整测试与自举
        run: |
          make
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
          make selfhost-native

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 打包
        run: |
          mkdir -p out
          install -m 0755 yh out/yh
          file out/yh | tee /tmp/file.txt
          grep -q 'x86-64' /tmp/file.txt
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-linux-x86_64.tar.gz" -C out yh
          sha256sum "yh-${TAG}-linux-x86_64.tar.gz" > "yh-${TAG}-linux-x86_64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            yh-*-linux-x86_64.tar.gz
            yh-*-linux-x86_64.sha256

  darwin-arm64:
    name: 构建 Darwin arm64（Mach-O）
    if: ${{ github.event_name == 'push' || inputs.x64_only == false || inputs.x64_only == 'false' }}
    runs-on: macos-14
    env:
      # 种子默认 LLVM，自举链接需要固定 LLVM/lld/桥归档；不能依赖种子内嵌的
      # 构建机绝对路径。
      YH_LLVM_HOST: "1"
      LLVM_JOBS: "2"
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      YHL_SEED_EXCLUDE: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 编译器自举仍由 Apple clang 编译 bridge_stub.c 等 C 源，需要 SDK 头；
      # 这里只准备构建环境，不改变用户程序使用 compiler/darwin-sdk 的行为。
      - name: 选择 Xcode macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: 下载上一版 Release 种子
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/fetch-release-seed.py --platform darwin-arm64 \
            --dest bin/yh-darwin-arm64 --exclude-tag "${YHL_SEED_EXCLUDE}"

      # 与 ci.yml darwin 作业同键：固定包/桥/SDK/部署版本变化即失效。
      - name: 恢复 Darwin 固定 LLVM 缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-darwin-host-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}


      - name: make
        run: make

      - name: 完整测试与自举
        env:
          LLVM_JOBS: "2"
        run: |
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet
          make test-llvm-darwin
          make selfhost-llvm-darwin
          make selfhost-native

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 打包
        run: |
          file yh
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-darwin-arm64.tar.gz" yh
          shasum -a 256 "yh-${TAG}-darwin-arm64.tar.gz" > "yh-${TAG}-darwin-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: |
            yh-*-darwin-arm64.tar.gz
            yh-*-darwin-arm64.sha256

  release:
    name: 发布 Release
    needs: [antlr, linux-arm64, linux-x86_64, darwin-arm64]
    if: ${{ always() && needs.antlr.result == 'success' && needs.linux-x86_64.result == 'success' && needs.linux-arm64.result != 'failure' && needs.darwin-arm64.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并归档
        env:
          GH_TOKEN: ${{ github.token }}
          # 无 checkout、没有 .git，gh 无法从 remote 推断仓库，显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          cat > notes.md <<'EOF'
          ## 产物说明

          - `*-darwin-arm64.tar.gz`：macOS（Apple Silicon）Mach-O，解压即用：
            `./yh hello.yh -o hello`
          - `*-linux-arm64.tar.gz`：AArch64 Linux ELF（编译器二进制，
            仅 ELF 链接需要，Mach-O 不需要）。Linux 下指到解压目录即可：
            `YH_LIBDIR=$(pwd) ./yh hello.yh -o hello`
          - `*-linux-x86_64.tar.gz`：x86_64 Linux ELF（LLVM 默认后端）；
            解压后 `./yh hello.yh -o hello` 即可。

          - `yh`：自举编译器（主编译器）。滚动自举：下一版本的 CI 与
            Release 会直接下载本 Release 对应平台的 `yh` 资产作为种子。
          - `.sha256` 为对应 tar.gz 的 SHA-256 校验和。
          EOF
          sed -i 's/^          //' notes.md
          TAG="${YHL_RELEASE_TAG}"
          # 已存在同名 Release（例如补充 x64 资产）时原地覆盖，避免重跑失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "yh ${TAG}" \
              --notes-file notes.md
          fi
