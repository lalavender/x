name: Release

# 滚动自举发布：编译器就是 yh，由上一版二进制编译当前源码。
#  - linux 作业：种子取上一版 Release 的 linux-arm64 资产（bin/ 入库种子
#    是宿主 Mach-O，Linux 无法执行；QEMU 容器内 make SEED=… 构建并冒烟；
#  - darwin 作业：直接用入库 bin/yh（Mach-O）构建并冒烟；
#  - release 作业：tar.gz + sha256 归档到 GitHub Release（下一版的种子）。
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  linux-arm64:
    name: 构建 AArch64 Linux（ELF）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 免费私有仓库没有 arm64 原生 runner，用 QEMU 在 x86_64 runner 上
      # 仿真 arm64 容器；产物是货真价实的 AArch64 Linux ELF。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 下载上一版 Release 的 linux-arm64 资产（编译种子）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CUR="${GITHUB_REF_NAME}"
          TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" --jq '.[].tag_name' 2>/dev/null)" || {
            echo "gh api 查询 Release 列表失败"; exit 1
          }
          if [ -z "$TAGS" ]; then
            echo "仓库没有任何 Release（滚动自举需要上一版的 linux-arm64 资产作种子）"
            exit 1
          fi
          PREV=""
          for t in $TAGS; do
            if [ "$t" != "$CUR" ]; then PREV="$t"; break; fi
          done
          if [ -z "$PREV" ]; then
            echo "找不到上一版 Release（滚动自举需要它的 linux-arm64 资产作种子）"
            exit 1
          fi
          echo "上一版 Release：$PREV"
          gh release download "$PREV" -p 'yh-*-linux-arm64.tar.gz' -O prev.tgz
          mkdir prevseed && tar xzf prev.tgz -C prevseed
          # 0.0.2 及以前的包内主编译器叫 yh-new，之后叫 yh
          if [ -x prevseed/yh-new ]; then SEED_BIN=yh-new; else SEED_BIN=yh; fi
          echo "SEED_BIN=$SEED_BIN" >> "$GITHUB_ENV"
          test -f prevseed/yh

      - name: 容器内 make 与冒烟（ubuntu:24.04）
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/repo:ro \
            -e SEED_BIN \
            -v "$PWD/out":/out \
            -v /tmp/smoke.yh:/smoke.yh:ro \
            ubuntu:24.04 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq build-essential >/dev/null
              cp -r /repo /build
              cd /build
              make SEED=/repo/prevseed/$SEED_BIN
              # 开箱状态冒烟（链接走容器内系统 gcc）
              ./yh /smoke.yh -o /tmp/smoke && /tmp/smoke
              # 两个产物都在容器内写入（容器是 root，外层步骤对 root 所有的
              # out/ 目录没有写权限，只读打包）
              cp yh /out/
                          '

      - name: 打包
        run: |
          file out/yh
          TAG="${GITHUB_REF_NAME}"
          tar czf "yh-${TAG}-linux-arm64.tar.gz" -C out yh
          sha256sum "yh-${TAG}-linux-arm64.tar.gz" > "yh-${TAG}-linux-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            yh-*-linux-arm64.tar.gz
            yh-*-linux-arm64.sha256

  darwin-arm64:
    name: 构建 Darwin arm64（Mach-O）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: make
        run: make

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 打包
        run: |
          file yh
          TAG="${GITHUB_REF_NAME}"
          tar czf "yh-${TAG}-darwin-arm64.tar.gz" yh
          shasum -a 256 "yh-${TAG}-darwin-arm64.tar.gz" > "yh-${TAG}-darwin-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: |
            yh-*-darwin-arm64.tar.gz
            yh-*-darwin-arm64.sha256

  release:
    name: 发布 Release
    needs: [linux-arm64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并归档
        env:
          GH_TOKEN: ${{ github.token }}
          # 无 checkout、没有 .git，gh 无法从 remote 推断仓库，显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          cat > notes.md <<'EOF'
          ## 产物说明

          - `*-darwin-arm64.tar.gz`：macOS（Apple Silicon）Mach-O，解压即用：
            `./yh hello.yh -o hello`
          - `*-linux-arm64.tar.gz`：AArch64 Linux ELF（编译器二进制，
            仅 ELF 链接需要，Mach-O 不需要）。Linux 下指到解压目录即可：
            `YH_LIBDIR=$(pwd) ./yh hello.yh -o hello`

          - `yh`：自举编译器（主编译器）。滚动自举：本 Release 的
            linux-arm64 资产是下一版本 CI 的编译种子；仓库 `bin/yh` 为
            Darwin 入库种子。
          - `.sha256` 为对应 tar.gz 的 SHA-256 校验和。
          EOF
          sed -i 's/^          //' notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "yh ${GITHUB_REF_NAME}" \
            --notes-file notes.md
