name: release
# 版本 tag 发布（GitHub Actions，四平台原生托管 runner）。
#
# 结构：prepare 校验 tag → 四个平台 job 并行「取种 → 闭包 → 门禁 → 打包资产」
# → publish 汇总发布 GitHub Release。
#
# 门禁与分支门是同一份定义：`KEEP=1 just ci-gate`（test 三层 → 平台专项门 →
# 自举两代固定点，并保留 cc4），打包用 `just release-asset`。两边都只调 justfile，
# YAML 只管 runner、系统依赖、窗口与缓存；新增测试/改门禁改 justfile。
#
# 只认 x.y.z 与 x.y.z-rc.N；其他 tag（如 seed-*）由 prepare 判定后整体跳过。
# 种子一律取「最新带该平台资产的 Release（排除当前 tag）」：rc.N 用 rc.N-1、
# 正式版用该版最后一个 rc（与分支门同一规则）。
#
# 资产名沿用既有约定：linux-arm64 / linux-x86_64 / darwin-arm64 / windows-x64
# （= publish-release.py 与 fetch-release-seed.py 的 PLATFORMS 键），因此
# linux-x64 这个 job 产出的资产叫 yh-<tag>-linux-x86_64.tar.gz，不要改名。
#
# 动作版本、runner pin、闭包缓存 key/restore-keys 与 `.github/workflows/ci.yml`
# 保持一致：缓存条目是同一个存储，key 相同才能两边互相命中。
on:
  push:
    tags: ['*']
  # 演练入口：dispatch 时当前 ref 是分支，必须显式给 tag 输入。
  # dry_run=true 时四端照常构建并上传 artifact，但跳过 publish。
  workflow_dispatch:
    inputs:
      tag:
        description: 版本 tag（如 0.0.13-rc.1），必须与源码里的版本号一致
        required: true
      dry_run:
        description: 只构建不发布
        type: boolean
        default: true

# 工作流默认只读；只有 publish 需要写 Release。
permissions:
  contents: read

env:
  LLVM_JOBS: "2"
  # Windows 上 Python 默认 GBK，门禁脚本都用 text=True 读编译器输出。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # 与 ci.yml 同口径：参考语法层要 Java + antlr venv，runner 没有。
  YH_ANTLR: "0"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.ver.outputs.ok }}
      tag: ${{ steps.ver.outputs.tag }}
      dry: ${{ steps.ver.outputs.dry }}
    env:
      TAG_INPUT: ${{ inputs.tag }}
      DRY_INPUT: ${{ inputs.dry_run }}
    steps:
      # 需要源码：版本号一致性与 tag 落点都要读树、走 git 历史。
      - name: 检出待发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # 三道校验，任一不过即红：tag 形态、版本号三处一致、正式 tag 落在主线 llvm 上。
      - name: 校验版本 tag、版本号一致性与主线落点
        id: ver
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          if [[ -z "${TAG_INPUT:-}" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "FAIL workflow_dispatch 必须提供 tag 输入（如 0.0.13-rc.1）" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "跳过：$tag 不是版本 tag（只发布 x.y.z 与 x.y.z-rc.N）"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 1) 版本号三处一致：tag、project.toml、编进二进制的 YH_VERSION_TEXT。
          #    --version 只读 YH_VERSION_TEXT，漏改会出现「tag 是正式版、二进制自报 rc」，
          #    而 Release 资产发布后不可改，所以必须在构建前拦住。
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' compiler/project.toml | head -n1)
          text=$(sed -n 's/.*YH_VERSION_TEXT \*char = "yh \([^"]*\)".*/\1/p' compiler/cmdline/cmdline.yh | head -n1)
          if [[ -z "$version" || -z "$text" ]]; then
            echo "FAIL 读不到版本号：project.toml='$version' YH_VERSION_TEXT='$text'" >&2
            exit 1
          fi
          if [[ "$version" != "$tag" || "$text" != "$tag" ]]; then
            echo "FAIL 版本号不一致：tag=$tag project.toml=$version --version=$text" >&2
            echo "      先改两处版本号再打 tag（Release 资产不可改）" >&2
            exit 1
          fi
          echo "版本号一致：$tag"

          # 2) 正式 tag 必须落在主线 llvm 上；rc 候选线（*-rc.*）不要求。
          #    （2026-11-06 前该落点是 <ver>-release，分支流程退役后改为主线。）
          case "$tag" in
            *-rc.*)
              echo "rc 候选：跳过主线落点校验"
              ;;
            *)
              branch=llvm
              # 取不到时区分不了"分支不存在"与"网络抖动"，两种情况都按不通过处理：
              # 正式发布不能因为一次网络失败就放过落点校验。
              if ! git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" >/dev/null 2>&1; then
                echo "FAIL 无法获取分支 $branch（网络失败或分支不存在）：正式 tag 必须打在 llvm 上" >&2
                exit 1
              fi
              commit=$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || git rev-parse HEAD)
              if ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch"; then
                echo "FAIL tag $tag（$commit）不是 $branch 的祖先：正式版只能在主线上打 tag" >&2
                exit 1
              fi
              echo "落点校验通过：$tag 在 $branch 上"
              ;;
          esac

          dry=0
          if [[ "${DRY_INPUT:-false}" == "true" ]]; then dry=1; fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "ok=1" >> "$GITHUB_OUTPUT"
          echo "版本 tag：$tag（dry_run=$dry）"

  # ------------------------------------------------------------------------
  # 四端构建：各 job 自取种子、准备本机 LLVM 闭包、跑与分支门同一份 ci-gate
  # （KEEP=1 保留 cc4），再用 release-asset 打成 yh-<tag>-<平台>.tar.gz
  # （成员名必须是 yh，fetch-release-seed.py 的 extract_yh 只认这个名字）。
  #
  # 种子取「最新带该平台资产的 Release」：0.0.12 起四端资产齐备，种子已认识
  # `windows` 标记、`*.windows.*.yh` 变体与 `.test.yh` 排序，故直接 `just build`。
  # ------------------------------------------------------------------------

  linux-x64:
    needs: prepare
    if: needs.prepare.outputs.ok == '1'
    # 固定 24.04，与 ci.yml 同一个 pin（理由见 ci.yml 的平台矩阵说明）。
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: extractions/setup-just@v2

      - name: 安装构建依赖
        # libxml2/zlib/zstd：种子与内嵌宿主按动态库链接，缺 runtime 会 127。
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential binutils libxml2-dev zlib1g-dev libzstd-dev

      - name: 取上一版种子
        run: |
          set -euo pipefail
          python3 tools/fetch-release-seed.py --platform linux-x86_64 --exclude-tag "$TAG"

      - name: 准备闭包
        run: just llvm-host

      - name: 门禁（与分支门同一份 ci-gate，保留自举候选）
        run: KEEP=1 just ci-gate

      - name: 打包发布资产
        run: just release-asset "$TAG" linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/yh-${{ needs.prepare.outputs.tag }}-linux-x86_64.tar.gz
            dist/yh-${{ needs.prepare.outputs.tag }}-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 7

  linux-arm64:
    needs: prepare
    if: needs.prepare.outputs.ok == '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: extractions/setup-just@v2

      - name: 安装构建依赖（含 Windows 目标门所需的 llvm-18 工具）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential binutils clang llvm-18 lld-18 \
            libxml2-dev zlib1g-dev libzstd-dev
          for tool in llvm-dlltool llvm-readobj llvm-nm llvm-ar llvm-lib lld-link; do
            if [ -x "/usr/bin/$tool-18" ]; then sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"; fi
          done

      - name: 取上一版种子
        run: |
          set -euo pipefail
          python3 tools/fetch-release-seed.py --platform linux-arm64 --exclude-tag "$TAG"

      - name: 准备闭包
        run: just llvm-host

      - name: 门禁（与分支门同一份 ci-gate，保留自举候选）
        run: KEEP=1 just ci-gate

      - name: 打包发布资产
        run: just release-asset "$TAG" linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/yh-${{ needs.prepare.outputs.tag }}-linux-arm64.tar.gz
            dist/yh-${{ needs.prepare.outputs.tag }}-linux-arm64.sha256
          if-no-files-found: error
          retention-days: 7

  darwin-arm64:
    needs: prepare
    if: needs.prepare.outputs.ok == '1'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: extractions/setup-just@v2

      - name: 取上一版种子
        run: |
          set -euo pipefail
          python3 tools/fetch-release-seed.py --platform darwin-arm64 --exclude-tag "$TAG"

      # 缓存 key/restore-keys 与 ci.yml 完全一致：缓存条目不承担正确性，失效
      # 判定交给 just llvm-host 的身份 check，这里只承担命中率。
      - name: 恢复 Darwin 闭包缓存
        id: closure-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/llvm-migration
          key: llvm-darwin-${{ hashFiles('tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}
          restore-keys: |
            llvm-darwin-

      - name: 准备 Darwin 闭包（缓存未命中时源码构建 LLVM）
        run: just llvm-host

      - name: 保存 Darwin 闭包缓存
        if: success() && steps.closure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/llvm-migration
          key: ${{ steps.closure-cache.outputs.cache-primary-key }}

      - name: 门禁（与分支门同一份 ci-gate，保留自举候选）
        run: KEEP=1 just ci-gate

      - name: 打包发布资产
        run: just release-asset "$TAG" darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: |
            dist/yh-${{ needs.prepare.outputs.tag }}-darwin-arm64.tar.gz
            dist/yh-${{ needs.prepare.outputs.tag }}-darwin-arm64.sha256
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    needs: prepare
    if: needs.prepare.outputs.ok == '1'
    # pin 2022，与 ci.yml 一致：windows-latest（VS 18）下闭包 CMake 生成器写死的
    # 「Visual Studio 17 2022」找不到实例，缓存 miss 时闭包会建不起来。
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        # Windows 上统一用 Git Bash（just 配方本身就是 bash；python 命令是 python）。
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLVM_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # 托管 runner 没有预装 just，由 action 装到 PATH（与 ci.yml 同版本）。
      - uses: extractions/setup-just@v2

      - name: 取上一版种子
        run: |
          set -euo pipefail
          python tools/fetch-release-seed.py --platform windows-x64 --exclude-tag "$TAG"

      # 缓存 key/restore-keys 与 ci.yml 完全一致（三个目录：闭包归档、身份记录、
      # Windows SDK 导入库）。
      - name: 恢复 Windows 闭包缓存
        id: closure-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/llvm-migration/windows-llvm-closure
            tmp/llvm-migration/llvm-host-windows-x86_64
            tmp/llvm-migration/windows-sdk
          key: llvm-windows-${{ hashFiles('tools/llvm-windows-closure.py', 'tools/llvm-windows-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/windows_shim.c', 'compiler/project.toml') }}
          restore-keys: |
            llvm-windows-

      - name: 准备 Windows 闭包（缓存未命中时 MSVC 源码构建 LLVM/lld）
        run: just llvm-host

      - name: 保存 Windows 闭包缓存
        if: success() && steps.closure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/llvm-migration/windows-llvm-closure
            tmp/llvm-migration/llvm-host-windows-x86_64
            tmp/llvm-migration/windows-sdk
          key: ${{ steps.closure-cache.outputs.cache-primary-key }}

      - name: 门禁（与分支门同一份 ci-gate，保留自举候选）
        run: KEEP=1 just ci-gate

      - name: 打包发布资产
        run: just release-asset "$TAG" windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/yh-${{ needs.prepare.outputs.tag }}-windows-x64.tar.gz
            dist/yh-${{ needs.prepare.outputs.tag }}-windows-x64.sha256
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------
  # 汇总发布：四个 artifact 齐了才发布；缺 release 说明文件直接失败。
  # ------------------------------------------------------------------------
  publish:
    needs: [prepare, linux-x64, linux-arm64, darwin-arm64, windows-x64]
    # dry_run（演练）只到四端构建与 artifact 为止，不写 Release。
    if: needs.prepare.outputs.dry != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 下载四端构建资产
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: 校验资产与发布说明齐全
        run: |
          set -euo pipefail
          ls -l dist
          # PLATFORMS 键（与 publish-release.py 一致）：linux-x86_64 对应 linux-x64 job。
          for platform in linux-arm64 linux-x86_64 darwin-arm64 windows-x64; do
            for suffix in tar.gz sha256; do
              asset="dist/yh-$TAG-$platform.$suffix"
              if [ ! -s "$asset" ]; then
                echo "FAIL 缺少发布资产：$asset" >&2
                exit 1
              fi
            done
            # 压缩包必须恰好是一个名为 yh 的成员：fetch-release-seed.py 的
            # extract_yh 只认这个名字（Windows 的 yh.exe 已在打包时改名）。
            members=$(tar -tzf "dist/yh-$TAG-$platform.tar.gz")
            if [ "$members" != "yh" ]; then
              echo "FAIL $platform 资产成员异常，应为单个 yh：$members" >&2
              exit 1
            fi
            # 校验和必须与下载到的包一致，资产被截断/覆盖要在这里就红。
            ( cd dist && sha256sum -c "yh-$TAG-$platform.sha256" )
          done
          # 种子规则：rc 与正式版都要写发布说明，缺失即失败（不允许静默兜底）。
          notes="docs/01-finished/release-$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "FAIL 缺少发布说明：$notes（rc 与正式版都必须写）" >&2
            exit 1
          fi

      - name: 发布 GitHub Release
        run: |
          set -euo pipefail
          # GITHUB_REPOSITORY / GITHUB_TOKEN 由环境提供，脚本自行按 tag 判定
          # prerelease（含 -rc. 即 prerelease）并做上传后大小校验。
          python3 tools/publish-release.py \
            --tag "$TAG" \
            --dist dist \
            --notes "docs/01-finished/release-$TAG.md"
