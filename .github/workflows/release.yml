name: Release

# 滚动自举发布：编译器就是 yh，由上一版二进制编译当前源码。
#  - linux 作业：种子用入库的 bin/yh-linux-arm64（它本身就是上一代 Linux 种子，
#    Makefile 在 aarch64 宿主上自动选它）；QEMU 容器内 make 构建并冒烟；
#  - darwin 作业：用入库 bin/yh-darwin-arm64（Mach-O）构建并冒烟，种子落后一代时先自动补代；
#  - release 作业：tar.gz + sha256 归档到 GitHub Release（下一版的种子）。
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要归档的 tag（例如 0.0.5）
        required: true
        default: 0.0.5
      x64_only:
        description: 只构建 linux-x86_64，并补到已有 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux-arm64:
    name: 构建 AArch64 Linux（ELF）
    if: ${{ github.event_name == 'push' || inputs.x64_only == false || inputs.x64_only == 'false' }}
    runs-on: ubuntu-latest
    env:
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 免费私有仓库没有 arm64 原生 runner，用 QEMU 在 x86_64 runner 上
      # 仿真 arm64 容器；产物是货真价实的 AArch64 Linux ELF。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 容器内 make 与冒烟（ubuntu:24.04）
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/repo:ro \
            -v "$PWD/out":/out \
            -v /tmp/smoke.yh:/smoke.yh:ro \
            ubuntu:24.04 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              # Makefile 的 verify-seed / seed-build.py 都要 python3，只装
              # build-essential 会让 make 以 127 失败（2026-10-13 0.0.4 首跑踩到）
              apt-get install -y -qq build-essential python3 >/dev/null
              cp -r /repo /build
              cd /build
              # 种子用入库的 bin/yh-linux-arm64（aarch64 宿主上 Makefile 自动选它）
              make
              # 开箱状态冒烟（链接走容器内系统 gcc）
              ./yh /smoke.yh -o /tmp/smoke && /tmp/smoke
              # 两个产物都在容器内写入（容器是 root，外层步骤对 root 所有的
              # out/ 目录没有写权限，只读打包）
              cp yh /out/
                          '

      - name: 打包
        run: |
          file out/yh
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-linux-arm64.tar.gz" -C out yh
          sha256sum "yh-${TAG}-linux-arm64.tar.gz" > "yh-${TAG}-linux-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            yh-*-linux-arm64.tar.gz
            yh-*-linux-arm64.sha256

  linux-x86_64:
    name: 构建 x86_64 Linux（ELF）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # x64 种子（seed-llvm-x64-2026-10-19）动态依赖 libxml2.so.16，
      # Ubuntu 24.04 没有该 soname；这里沿用 CI 已验证的
      # AArch64 种子 + QEMU 交叉构建，最终 D-O2 是可在 Ubuntu 运行的 x64 ELF。
      YH_LLVM_HOST: "1"
      YH_LINK: /nonexistent
      LLVM_JOBS: "2"
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 安装交叉工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 gcc-aarch64-linux-gnu
          # qemu-user 的 -L 前缀映射 /lib/aarch64-linux-gnu。
          sudo ln -sfn . /usr/aarch64-linux-gnu/lib/aarch64-linux-gnu
          mkdir -p "$RUNNER_TEMP/yh-crossbin"
          cat > "$RUNNER_TEMP/yh-crossbin/gcc" <<'EOF'
          #!/bin/sh
          exec aarch64-linux-gnu-gcc "$@"
          EOF
          chmod +x "$RUNNER_TEMP/yh-crossbin/gcc"
          echo "$RUNNER_TEMP/yh-crossbin" >> "$GITHUB_PATH"

      # 与 ci.yml x64 作业同键；命中后固定 SDK 可离线使用。
      - name: 恢复固定 LLVM SDK 缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-host-${{ runner.os }}-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-sdk.py', 'tools/llvm-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp', 'compiler/llvm/lld_stub.cpp') }}

      - name: 构建 x86_64 D-O2
        run: |
          rm -rf /tmp/yh-release-x64
          python3 tests/selfhost/llvm-selfhost.py \
            --seed "$PWD/bin/yh-linux-arm64" --jobs 2 \
            --workdir /tmp/yh-release-x64

      - name: 冒烟
        run: |
          cp /tmp/yh-release-x64/candidates/yh-D-O2 out-yh
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          out-yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 打包
        run: |
          mkdir -p out
          cp out-yh out/yh
          file out/yh | tee /tmp/file.txt
          grep -q 'x86-64' /tmp/file.txt
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-linux-x86_64.tar.gz" -C out yh
          sha256sum "yh-${TAG}-linux-x86_64.tar.gz" > "yh-${TAG}-linux-x86_64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            yh-*-linux-x86_64.tar.gz
            yh-*-linux-x86_64.sha256

  darwin-arm64:
    name: 构建 Darwin arm64（Mach-O）
    if: ${{ github.event_name == 'push' || inputs.x64_only == false || inputs.x64_only == 'false' }}
    runs-on: macos-14
    env:
      # 种子默认 LLVM，自举链接需要固定 LLVM/lld/桥归档；不能依赖种子内嵌的
      # 构建机绝对路径。
      YH_LLVM_HOST: "1"
      LLVM_JOBS: "2"
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 编译器自举仍由 Apple clang 编译 bridge_stub.c 等 C 源，需要 SDK 头；
      # 这里只准备构建环境，不改变用户程序使用 compiler/darwin-sdk 的行为。
      - name: 选择 Xcode macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      # 与 ci.yml darwin 作业同键：固定包/桥/SDK/部署版本变化即失效。
      - name: 恢复 Darwin 固定 LLVM 缓存
        uses: actions/cache@v4
        with:
          path: tmp/llvm-migration
          key: llvm-darwin-host-${{ hashFiles('vendor/llvm/sdk.lock.json', 'tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}

      # 入库 bin/yh-darwin-arm64 落后一代时先补一代（与 ci.yml 的 darwin 作业同一段逻辑）：
      # 种子带「struct/union/enum 必须带 pub」门禁时编不了当前源码，所以先把它
      # 自检出的 13 处模块私有类型临时改回 pub，用旧种子编出这一代并 make seed，
      # 再还原源码继续构建 HEAD。种子已支持裸 struct 时本步骤自动跳过。
      - name: 必要时补一代 macOS 种子
        run: |
          set -euo pipefail
          cat > /tmp/bare.yh <<'EOF'
          struct S { v int; }
          fn main() int { let s S; s.v = 1; return s.v - 1; }
          EOF
          if bin/yh-darwin-arm64 --syntax-check /tmp/bare.yh >/dev/null 2>&1; then
            echo "入库种子已支持模块私有类型，无需中间代"
            exit 0
          fi
          echo "入库种子落后一代：造「语言规则一代」（类型临时恢复 pub）"
          python3 - <<'PY'
          import pathlib
          import sys

          TARGETS = [
              ("compiler/ast/ast_expr.yh", "AstExpr"),
              ("compiler/ast/ast_function.yh", "AstFunctionContext"),
              ("compiler/ast/ast_ir_build.yh", "AstIRBuilder"),
              ("compiler/ast/ast_ir_inline.yh", "AstIRInlineEntry"),
              ("compiler/ast/ast_stmt.yh", "AstStmt"),
              ("compiler/cmd/toml.yh", "TomlArrayItem"),
              ("compiler/cmd/toml.yh", "TomlSec"),
              ("compiler/cmd/project.yh", "PJDirEntry"),
              ("compiler/cmd/clock.darwin.yh", "CmdTimespec"),
              ("compiler/cmd/clock.linux.arm64.yh", "CmdTimespec"),
              ("compiler/comptime/ct_ir_data.yh", "CtDataSlice"),
              ("compiler/comptime/ct_global_agg.yh", "CtGlobalAgg"),
              ("compiler/parse/iface_ct_map.yh", "IfaceCtColMap"),
          ]
          done = 0
          for rel, name in TARGETS:
              path = pathlib.Path(rel)
              # newline="" 按字节保留行尾，避免在 CRLF 检出上重写整文件
              text = path.read_text(encoding="utf-8", newline="")
              old = "struct " + name + " "
              new = "pub struct " + name + " "
              hits = text.count("\n" + old)
              if hits != 1:
                  sys.exit(f"{rel}: {name} 命中 {hits} 处，期望 1 处")
              path.write_text(text.replace("\n" + old, "\n" + new),
                              encoding="utf-8", newline="")
              done += 1
          print(f"已临时恢复 {done} 处类型的 pub")
          PY
          make
          make seed
          git checkout -- compiler
          python3 tools/selfhost_snapshot_gate.py --verify-seed "$PWD/bin/yh-darwin-arm64"
          echo "中间代种子已就位（本作业检出内的 bin/yh-darwin-arm64 与 .sha256 已更新）"

      - name: make
        run: make

      - name: 冒烟
        run: |
          cat > /tmp/smoke.yh <<'EOF'
          fn main() int {
              printf("hello, yh!\n");
              return 0;
          }
          EOF
          ./yh /tmp/smoke.yh -o /tmp/smoke && /tmp/smoke

      - name: 打包
        run: |
          file yh
          TAG="${YHL_RELEASE_TAG}"
          tar czf "yh-${TAG}-darwin-arm64.tar.gz" yh
          shasum -a 256 "yh-${TAG}-darwin-arm64.tar.gz" > "yh-${TAG}-darwin-arm64.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: |
            yh-*-darwin-arm64.tar.gz
            yh-*-darwin-arm64.sha256

  release:
    name: 发布 Release
    needs: [linux-arm64, linux-x86_64, darwin-arm64]
    if: ${{ always() && needs.linux-x86_64.result == 'success' && needs.linux-arm64.result != 'failure' && needs.darwin-arm64.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      YHL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并归档
        env:
          GH_TOKEN: ${{ github.token }}
          # 无 checkout、没有 .git，gh 无法从 remote 推断仓库，显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          cat > notes.md <<'EOF'
          ## 产物说明

          - `*-darwin-arm64.tar.gz`：macOS（Apple Silicon）Mach-O，解压即用：
            `./yh hello.yh -o hello`
          - `*-linux-arm64.tar.gz`：AArch64 Linux ELF（编译器二进制，
            仅 ELF 链接需要，Mach-O 不需要）。Linux 下指到解压目录即可：
            `YH_LIBDIR=$(pwd) ./yh hello.yh -o hello`
          - `*-linux-x86_64.tar.gz`：x86_64 Linux ELF（LLVM 默认后端）；
            解压后 `./yh hello.yh -o hello` 即可。

          - `yh`：自举编译器（主编译器）。滚动自举：本 Release 的
            linux-arm64 资产是下一版本 CI 的编译种子；仓库 `bin/yh-darwin-arm64`
            为 Darwin 入库种子。
          - `.sha256` 为对应 tar.gz 的 SHA-256 校验和。
          EOF
          sed -i 's/^          //' notes.md
          TAG="${YHL_RELEASE_TAG}"
          # 已存在同名 Release（例如补充 x64 资产）时原地覆盖，避免重跑失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "yh ${TAG}" \
              --notes-file notes.md
          fi
