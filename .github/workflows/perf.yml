name: perf
# 性能基线（GitHub Actions，macos-15 原生托管 runner）。
#
# 刻意**不设性能硬门**（2026-10-26 用户决定）：本 workflow 只负责在安静时段
# 重测并把报告作为构建资产归档，回退判断按
# docs/03-design/yh-性能回归判定与噪声校准-2026-10-26.md 的流程另立项。
# 只有「测量本身失败」（构建不过、批次 invalid、报告缺失）才让 job 变红。
#
# 触发：手动（可调轮数）与每日 02:00（cron 按 UTC 写 18:00，对应 UTC+8 02:00）。
# 动作版本、闭包缓存 key/restore-keys 与 `.github/workflows/ci.yml` 一致，
# 缓存条目与分支门/发布 workflow 互相命中。
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 每场景计分轮数
        default: "20"
      runs:
        description: 产物每档轮数
        default: "5"
  schedule:
    - cron: "0 18 * * *"

# 只读：性能报告只上传为构建资产，不写仓库。
permissions:
  contents: read

env:
  # macos-15 只有 3 核 7GiB，LLVM 构建与语料并发统一按 2 走。
  LLVM_JOBS: "2"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  darwin-baseline:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      - name: 取上一版种子
        run: |
          set -euo pipefail
          python3 tools/fetch-release-seed.py --platform darwin-arm64

      # 与 ci.yml 同一 key/restore-keys：谁先跑谁写缓存，其余直接命中。
      - name: 恢复 Darwin 闭包缓存
        id: closure-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/llvm-migration
          key: llvm-darwin-${{ hashFiles('tools/llvm-darwin-sdk.py', 'tools/llvm-darwin-host.py', 'compiler/llvm/bridge.c', 'compiler/llvm/bridge.h', 'compiler/llvm/lld_bridge.cpp') }}
          restore-keys: |
            llvm-darwin-

      - name: 准备 Darwin 闭包（缓存未命中时源码构建 LLVM）
        run: just llvm-host

      - name: 保存 Darwin 闭包缓存
        if: success() && steps.closure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/llvm-migration
          key: ${{ steps.closure-cache.outputs.cache-primary-key }}

      - name: 冷编
        run: just build

      - name: 编译体验基线（默认 20 轮 + 3 轮预热）
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          # 定时触发时 inputs 为空，统一用 shell 兜底（不依赖表达式真值语义）。
          iterations="${ITERATIONS:-20}"
          python3 tools/perf-baseline.py --iterations "$iterations" --warmup 3 \
            | tee tmp/perf-last.log

      - name: 并入产物质量（O0/O2）
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          runs="${RUNS:-5}"
          run_id=$(ls -1 tmp/perf | grep -E '^[0-9]{8}-[0-9]{6}(-[0-9]+)?$' | sort | tail -1)
          echo "run-id=$run_id" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/perf-product.py --runs "$runs" --warmup 2 \
            --outdir "tmp/perf/$run_id" --append-to "tmp/perf/$run_id/report.md"

      - name: 校验批次有效性
        run: |
          set -euo pipefail
          run_id=$(ls -1 tmp/perf | grep -E '^[0-9]{8}-[0-9]{6}(-[0-9]+)?$' | sort | tail -1)
          echo "run-id=$run_id" >> "$GITHUB_STEP_SUMMARY"
          # 测量无效（缺统计/超时/checksum 不符）→ job 变红；性能回退不在这里判。
          python3 tools/perf-batch-check.py "tmp/perf/$run_id"

      - name: 归档报告资产
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_id }}
          path: |
            tmp/perf/*/raw.json
            tmp/perf/*/report.md
            tmp/perf/*/product.json
            tmp/perf/*/product.md
            tmp/perf-last.log
          if-no-files-found: warn
          retention-days: 30
