name: probe
# 临时探针：确认四类 GitHub 托管 runner 的可用性与环境事实（验证后删除）。
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: facts
        run: |
          set -x
          uname -a; nproc; free -g; df -h /; python3 --version; just --version
          cmake --version | head -1; ninja --version; gcc --version | head -1; g++ --version | head -1
          which readelf nm ar make; clang --version | head -1
          curl -sSI --max-time 20 https://archive.ubuntu.com/ubuntu/ | head -3
          curl -sSI --max-time 20 https://api.github.com/ | head -3
      - uses: actions/cache@v4
        with:
          path: tmp/probe-cache
          key: probe-linux-${{ github.run_id }}
      - run: mkdir -p tmp/probe-cache && echo ok > tmp/probe-cache/a.txt

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: facts
        run: |
          set -x
          uname -a; nproc; free -g; df -h /; python3 --version; just --version
          cmake --version | head -1; ninja --version; gcc --version | head -1; g++ --version | head -1
          which readelf nm ar make; clang --version | head -1
          curl -sSI --max-time 20 https://ports.ubuntu.com/ubuntu-ports/ | head -3
          curl -sSI --max-time 20 https://api.github.com/ | head -3

  darwin-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: facts
        run: |
          set -x
          uname -a; sysctl -n hw.ncpu hw.memsize; df -h /; python3 --version; just --version
          cmake --version | head -1; ninja --version; clang --version | head -1
          xcrun --show-sdk-path; xcrun --sdk macosx --show-sdk-version
          xcodebuild -version | head -2
          curl -sSI --max-time 20 https://github.com/ | head -3
          curl -sSI --max-time 20 https://api.github.com/ | head -3

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: facts
        run: |
          set -x
          uname -a; python --version; just --version; df -h /c
          where clang; where llvm-dlltool; where cl; where link; where lib; where cmake; where ninja
          clang --version | head -2 || true
          ls "/c/Program Files/Microsoft Visual Studio/2022" 2>/dev/null || true
          curl -sSI --max-time 20 https://api.github.com/ | head -3
      - uses: actions/cache@v4
        with:
          path: tmp/probe-cache
          key: probe-win-${{ github.run_id }}
      - run: mkdir -p tmp/probe-cache && echo ok > tmp/probe-cache/a.txt
