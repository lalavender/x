version: 2.1

# CircleCI 分支门：原生 Linux/AArch64、Linux/x86_64、Darwin/ARM64。
#
# 分支流水线（arm64/llvm/main）：
#   - antlr：参考语法门；
#   - 三端从最新 GitHub Release 取种子，跑各平台默认 LLVM 主门。
#
# 发布已移到 Gitea Actions（.gitea/workflows/release.yml）：
# CircleCI 不再响应 tag，也不再创建/更新 GitHub Release。
# 本文件仅留作云端真机参照，不再是项目门禁。
#
# 需要项目环境变量 GITHUB_TOKEN（repo 权限），只用于取 Release 种子。

commands:
  install_linux_deps:
    description: 安装 Linux 构建、LLVM 宿主与 LFS 依赖
    steps:
      - run:
          name: 安装构建依赖
          command: |
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              build-essential python3 binutils xz-utils libxml2-dev               zlib1g-dev libzstd-dev

  fetch_latest_seed:
    description: 从 GitHub Release 取指定平台的上一版种子
    parameters:
      platform:
        type: string
    steps:
      - run:
          name: 获取最新 Release 种子（<< parameters.platform >>）
          command: |
            : "${GITHUB_TOKEN:?需要在 CircleCI 项目环境变量设置 GITHUB_TOKEN（repo 权限）}"
            : "${GITHUB_REPOSITORY:=lalavender/x}"
            export GH_TOKEN="$GITHUB_TOKEN"
            python3 tools/fetch-release-seed.py --platform << parameters.platform >> --exclude-tag "${CIRCLE_TAG:-}"

jobs:
  antlr:
    docker:
      # cimg/python:3.12 自带新版 pip；cimg/base:stable 仍是 Ubuntu 20.04 +
      # pip 20，tools/run-antlr-ci.sh 的 --break-system-packages 会直接失败。
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: 安装 Java/ANTLR 依赖
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq default-jre-headless python3-pip curl
      - run:
          name: ANTLR 参考语法门
          command: bash tools/run-antlr-ci.sh --quiet

  linux-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    environment:
      # CircleCI 项目元数据不是 lalavender/x；显式固定 GitHub Release 仓库。
      GITHUB_REPOSITORY: lalavender/x
      # 固定 SDK 未就绪时允许联网补齐；之后走 tmp/llvm-migration 缓存。
      YH_LLVM_HOST: "1"
    steps:
      - checkout
      - install_linux_deps
      - fetch_latest_seed:
          platform: linux-arm64
      - restore_cache:
          keys:
            - llvm-host-linux-arm64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-sdk.py" }}-{{ checksum "tools/llvm-host.py" }}-{{ checksum "tests/selfhost/llvm-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}-{{ checksum "compiler/llvm/lld_stub.cpp" }}
      - run:
          name: 准备固定 LLVM/lld 宿主并冷编
          command: make bootstrap
          no_output_timeout: 30m
      - save_cache:
          key: llvm-host-linux-arm64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-sdk.py" }}-{{ checksum "tools/llvm-host.py" }}-{{ checksum "tests/selfhost/llvm-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}-{{ checksum "compiler/llvm/lld_stub.cpp" }}
          paths:
            - tmp/llvm-migration
      - run:
          name: Linux/AArch64 LLVM 专项门
          command: make test-llvm-linux-arm64
      - run:
          name: 编译器语法与运行语料
          command: |
            python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
            python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(nproc)"
      - run:
          name: 自举主门（语料已单独跑过）
          command: |
            make selfhost-native SKIP_CORPUS=1

  linux-x86_64:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      GITHUB_REPOSITORY: lalavender/x
      SEED: bin/yh-linux-x64
      YH_LLVM_HOST: "1"
      LLVM_JOBS: "4"
    steps:
      - checkout
      - install_linux_deps
      - run:
          name: 安装 x64 runtime 导入审计依赖
          command: sudo apt-get install -y -qq clang
      - fetch_latest_seed:
          platform: linux-x86_64
      - restore_cache:
          keys:
            - llvm-host-linux-x86_64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-sdk.py" }}-{{ checksum "tools/llvm-host.py" }}-{{ checksum "tests/selfhost/llvm-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}-{{ checksum "compiler/llvm/lld_stub.cpp" }}
      - run:
          name: 准备固定 LLVM/lld 宿主并冷编
          command: make bootstrap
          no_output_timeout: 30m
      - save_cache:
          key: llvm-host-linux-x86_64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-sdk.py" }}-{{ checksum "tools/llvm-host.py" }}-{{ checksum "tests/selfhost/llvm-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}-{{ checksum "compiler/llvm/lld_stub.cpp" }}
          paths:
            - tmp/llvm-migration
      - run:
          name: 编译器语法与运行语料
          command: |
            python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
            python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(nproc)"
      - run:
          name: 自举主门（语料已单独跑过）
          command: |
            make selfhost-native SKIP_CORPUS=1

  darwin-arm64:
    macos:
      xcode: 26.5
    resource_class: m4pro.medium
    environment:
      GITHUB_REPOSITORY: lalavender/x
      SEED: bin/yh-darwin-arm64
      YH_LLVM_HOST: "1"
      LLVM_JOBS: "4"
    steps:
      - checkout
      - fetch_latest_seed:
          platform: darwin-arm64
      - run:
          name: 选择 Xcode macOS SDK
          command: |
            echo 'export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"' >> "$BASH_ENV"
      - run:
          name: 安装 CMake 与 Ninja
          command: brew install cmake ninja
      - restore_cache:
          keys:
            - llvm-host-darwin-aarch64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-darwin-sdk.py" }}-{{ checksum "tools/llvm-darwin-host.py" }}-{{ checksum "tests/selfhost/llvm-darwin-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}
      - run:
          name: 准备 Darwin LLVM/lld 宿主并冷编
          command: make bootstrap
          no_output_timeout: 45m
      - save_cache:
          key: llvm-host-darwin-aarch64-v2-{{ checksum "vendor/llvm/sdk.lock.json" }}-{{ checksum "tools/llvm-darwin-sdk.py" }}-{{ checksum "tools/llvm-darwin-host.py" }}-{{ checksum "tests/selfhost/llvm-darwin-host.py" }}-{{ checksum "compiler/llvm/bridge.c" }}-{{ checksum "compiler/llvm/bridge.h" }}-{{ checksum "compiler/llvm/lld_bridge.cpp" }}
          paths:
            - tmp/llvm-migration/darwin-sdk/sdk-darwin-aarch64
            - tmp/llvm-migration/llvm-host-darwin-aarch64
      - run:
          name: Darwin LLVM 专项门
          command: make test-llvm-darwin
      - run:
          name: 编译器语法与运行语料
          command: |
            python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
            python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(sysctl -n hw.ncpu)"
      - run:
          name: 自举主门（语料已单独跑过）
          command: |
            make selfhost-native SKIP_CORPUS=1

workflows:
  ci:
    jobs:
      - antlr:
          filters:
            branches:
              only: /^(arm64|llvm|main)$/
      - linux-arm64:
          filters:
            branches:
              only: /^(arm64|llvm|main)$/
      - linux-x86_64:
          filters:
            branches:
              only: /^(arm64|llvm|main)$/
      - darwin-arm64:
          filters:
            branches:
              only: /^(arm64|llvm|main)$/
