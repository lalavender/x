name: release
# 版本 tag 发布（Gitea Actions，本机 host 模式 runner，macOS/arm64 宿主）。
#
# 并行结构：prepare 预建镜像 → 三个平台 job 并行构建打包 → publish 汇总发布。
# host 模式下三个 job 在同一台机器的文件系统上，产物统一写到
# $HOME/yh-release-dist/ci-<run_id>，不需要 artifact 上传下载。
#
# 只认 x.y.z 与 x.y.z-rc.N；其他 tag（如 seed-*）在 prepare 判定后跳过。
on:
  push:
    tags:
      - '*'

env:
  LLVM_JOBS: "4"
  SEED_REPO: lalavender/x

jobs:
  prepare:
    runs-on: macos-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本 tag
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "版本 tag：$tag"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "跳过：$tag 不是版本 tag（只发布 x.y.z 与 x.y.z-rc.N）"
          fi

      - name: 预建 CI 镜像（arm64 + amd64，按 Dockerfile 哈希）
        if: steps.ver.outputs.ok == '1'
        run: |
          set -euo pipefail
          # 镜像标签带 Dockerfile 内容哈希：Dockerfile 变更后必须重建，否则会
          # 继续用旧镜像（迁移到 justfile 后旧镜像没有 just，容器内直接 127）。
          # 各平台 job 自己也会按同一哈希构建（层缓存命中，几乎零成本）。
          sig=$(shasum -a 256 .gitea/ci/Dockerfile | cut -c1-12)
          container build -t "yh-ci:ubuntu24-$sig" -f .gitea/ci/Dockerfile .
          container build -a amd64 -t "yh-ci:ubuntu24-amd64-$sig" -f .gitea/ci/Dockerfile .

  darwin-arm64:
    needs: prepare
    runs-on: macos-arm64
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 复用 LLVM 闭包缓存
        run: |
          set -euo pipefail
          mkdir -p tmp
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          if [ -d "$cache" ]; then
            ln -sfn "$cache" tmp/llvm-migration
            # 自举 flags 存的是首次构建时的绝对路径；统一改写为缓存真实路径。
            for f in "$cache"/llvm-host-darwin-*/selfhost-flags.txt; do
              [ -f "$f" ] || continue
              perl -pi -e "s#/Users/[^\s]*?/tmp/llvm-migration/#$cache/#g" "$f"
            done
            echo "复用闭包缓存：$cache"
          else
            just llvm-host
          fi
      - name: Darwin/arm64 构建与打包
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          python3 tools/fetch-release-seed.py --platform darwin-arm64 \
            --repo "$SEED_REPO" --exclude-tag "$tag"
          just bootstrap
          just test-llvm-darwin
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(sysctl -n hw.ncpu)"
          just SKIP_CORPUS=1 SELFHOST_KEEP=1 SELFHOST_WORKDIR=dist/selfhost selfhost-native
          cp dist/selfhost/cc4 yh
          rm -rf dist/selfhost
          # 打包自检：产物必须支持换行终结（rc.4 曾打包出不含该特性的旧二进制）。
          ./yh --syntax-check tests/yh/02-basic/04_newline_terminator.yh
          out="$HOME/yh-release-dist/ci-$GITHUB_RUN_ID"
          mkdir -p "$out"
          name="yh-$tag-darwin-arm64"
          stage="dist/.stage-darwin-arm64"
          mkdir -p "$stage"
          cp yh "$stage/yh"
          tar -czf "$out/$name.tar.gz" -C "$stage" yh
          rm -rf "$stage"
          (cd "$out" && shasum -a 256 "$name.tar.gz" > "$name.sha256")
          ls -l "$out/$name.tar.gz"

  linux-arm64:
    needs: prepare
    runs-on: macos-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Linux/AArch64 构建与打包（容器原生）
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          out="$HOME/yh-release-dist/ci-$GITHUB_RUN_ID"
          python3 tools/fetch-release-seed.py --platform linux-arm64 \
            --repo "$SEED_REPO" --exclude-tag "$tag"
          # 缓存挂到仓库内固定路径：llvm-host.py 要求产物路径 resolve 后仍在仓库内。
          rm -rf tmp/llvm-migration
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          mount=""
          if [ -d "$cache" ]; then mount="-v $cache:/work/tmp/llvm-migration"; fi
          sig=$(shasum -a 256 .gitea/ci/Dockerfile | cut -c1-12)
          img="yh-ci:ubuntu24-$sig"
          container build -t "$img" -f .gitea/ci/Dockerfile .
          container run --rm -m 3G -v "$PWD":/work -w /work $mount \
            -e LLVM_JOBS -e TAG="$tag" \
            "$img" bash -lc '
              set -euo pipefail
              just bootstrap
              just test-llvm-linux-arm64
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(nproc)"
              just SKIP_CORPUS=1 SELFHOST_KEEP=1 SELFHOST_WORKDIR=dist/selfhost selfhost-native
              cp dist/selfhost/cc4 yh
              rm -rf dist/selfhost
              ./yh --syntax-check tests/yh/02-basic/04_newline_terminator.yh
              name="yh-$TAG-linux-arm64"
              stage="dist/.stage-linux-arm64"
              mkdir -p "$stage"
              cp yh "$stage/yh"
              tar -czf "dist/$name.tar.gz" -C "$stage" yh
              rm -rf "$stage"
            '
          # 容器内看不到宿主绝对路径，打包产物从 /work 搬回汇总目录。
          mkdir -p "$out"
          mv "dist/yh-$tag-linux-arm64.tar.gz" "$out/"
          (cd "$out" && sha256sum "yh-$tag-linux-arm64.tar.gz" > "yh-$tag-linux-arm64.sha256")

  linux-x86_64:
    needs: prepare
    runs-on: macos-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Linux/x86_64 构建与打包（容器模拟）
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          out="$HOME/yh-release-dist/ci-$GITHUB_RUN_ID"
          python3 tools/fetch-release-seed.py --platform linux-x86_64 \
            --repo "$SEED_REPO" --exclude-tag "$tag"
          rm -rf tmp/llvm-migration
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          mount=""
          if [ -d "$cache" ]; then mount="-v $cache:/work/tmp/llvm-migration"; fi
          sig=$(shasum -a 256 .gitea/ci/Dockerfile | cut -c1-12)
          img="yh-ci:ubuntu24-amd64-$sig"
          container build -a amd64 -t "$img" -f .gitea/ci/Dockerfile .
          container run --rm -m 3G -a amd64 -v "$PWD":/work -w /work $mount \
            -e LLVM_JOBS -e TAG="$tag" \
            "$img" bash -lc '
              set -euo pipefail
              just bootstrap
              # 模拟环境下运行语义不可靠（run/20-bytebuf 曾信号 5），发布这里只做
              # 构建、语法语料与打包；运行证据以 CI 的 x64 任务与真机为准。
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              just SKIP_CORPUS=1 SELFHOST_KEEP=1 SELFHOST_WORKDIR=dist/selfhost selfhost-native
              cp dist/selfhost/cc4 yh
              rm -rf dist/selfhost
              ./yh --syntax-check tests/yh/02-basic/04_newline_terminator.yh
              name="yh-$TAG-linux-x86_64"
              stage="dist/.stage-linux-x86_64"
              mkdir -p "$stage"
              cp yh "$stage/yh"
              tar -czf "dist/$name.tar.gz" -C "$stage" yh
              rm -rf "$stage"
            '
          # 容器内看不到宿主绝对路径，打包产物从 /work 搬回汇总目录。
          mkdir -p "$out"
          mv "dist/yh-$tag-linux-x86_64.tar.gz" "$out/"
          (cd "$out" && sha256sum "yh-$tag-linux-x86_64.tar.gz" > "yh-$tag-linux-x86_64.sha256")

  publish:
    needs: [darwin-arm64, linux-arm64, linux-x86_64]
    runs-on: macos-arm64
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 发布 GitHub Release
        run: |
          set -euo pipefail
          dist="$HOME/yh-release-dist/ci-$GITHUB_RUN_ID"
          ls -l "$dist"
          python3 tools/publish-release.py \
            --repo "$SEED_REPO" \
            --tag "$GITHUB_REF_NAME" \
            --dist "$dist" \
            --notes "docs/01-finished/release-$GITHUB_REF_NAME.md"
