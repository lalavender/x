name: ci
# Gitea Actions 真构建验证（host 模式，macOS/arm64）。
# 阶段一：取种子；阶段二（验证后追加）：make + make test。
on: [push]
jobs:
  build:
    runs-on: macos-arm64
    env:
      # 种子仍从 GitHub Release 取（Gitea 侧尚未托管种子资产）。
      GITHUB_REPOSITORY: lalavender/x
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 取种子
        run: |
          set -euo pipefail
          make fetch-seed
          ls -l bin/
