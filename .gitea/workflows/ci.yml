name: ci
# 分支门（Gitea Actions，本机 host 模式 runner，macOS/arm64 宿主）。
#
# 推送 arm64 / llvm / main 与 <ver>-rc 时并行跑（<ver>-release 只在 tag 发布时
# 由 release.yml 覆盖，避免打 tag 时再多起一组 runner）：
#   antlr        参考语法门（Apple container 内）
#   darwin-arm64 宿主原生 LLVM 主门
#   linux-arm64  Apple container（arm64 原生）LLVM 主门
#   linux-x86_64 Apple container（amd64 模拟）LLVM 主门
# 版本 tag 发布见 release.yml。
#
# 种子仍托管在 GitHub Release：Gitea 会把 GITHUB_REPOSITORY 覆写成 yh/yh，
# 所以取种脚本一律用 --repo "$SEED_REPO" 显式指定。
on:
  push:
    branches:
      - arm64
      - llvm
      - main
      - '*-rc'

env:
  LLVM_JOBS: "4"
  SEED_REPO: lalavender/x

jobs:
  antlr:
    runs-on: macos-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ANTLR 参考语法门（容器内）
        run: |
          set -euo pipefail
          container run --rm -m 3G -v "$PWD":/work -w /work ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              python3 python3-pip default-jre-headless curl ca-certificates
            bash tools/run-antlr-ci.sh --quiet
          '

  darwin-arm64:
    runs-on: macos-arm64
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 复用 LLVM 闭包缓存
        run: |
          set -euo pipefail
          mkdir -p tmp
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          if [ -d "$cache" ]; then
            ln -sfn "$cache" tmp/llvm-migration
            # 自举 flags 里存的是首次构建时的绝对路径（绑定当时的 workspace）；
            # 统一改写为缓存真实路径，任何 workspace 都能复用。
            for f in "$cache"/llvm-host-darwin-*/selfhost-flags.txt; do
              [ -f "$f" ] || continue
              perl -pi -e "s#/Users/[^\s]*?/tmp/llvm-migration/#$cache/#g" "$f"
            done
            echo "复用闭包缓存：$cache"
          else
            make llvm-host
          fi
      - name: 取种子
        run: python3 tools/fetch-release-seed.py --platform darwin-arm64 --repo "$SEED_REPO"
      - name: 准备闭包并冷编
        run: make bootstrap
      - name: Darwin 专项门
        run: make test-llvm-darwin
      - name: 语法与运行语料
        run: |
          python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
          python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(sysctl -n hw.ncpu)"
      - name: TOML API 与一致性门
        run: |
          set -euo pipefail
          python3 tests/toml/conformance.py --prepare
          make test-toml
          make test-toml-conformance
          make test-toml-injection
          make test-toml-install
      - name: 自举主门（语料已单独跑）
        run: make selfhost-native SKIP_CORPUS=1

  linux-arm64:
    runs-on: macos-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 取种子（宿主；容器内 DNS 不通，取种不放容器）
        run: python3 tools/fetch-release-seed.py --platform linux-arm64 --repo "$SEED_REPO"
      - name: 准备 TOML 一致性语料（宿主；容器内 DNS 不通）
        run: python3 tests/toml/conformance.py --prepare
      - name: 确保 CI 镜像（arm64）
        run: |
          set -euo pipefail
          # 预装 build-essential/python3/clang 等（见 .gitea/ci/Dockerfile），
          # 避免每个 job 重复 apt 安装并累积容器快照。
          if ! container image list | grep -qE '^yh-ci[[:space:]]+ubuntu24[[:space:]]'; then
            container build -t yh-ci:ubuntu24 -f .gitea/ci/Dockerfile .
          fi

      - name: 容器内构建（Linux/AArch64 原生）
        run: |
          set -euo pipefail
          # 闭包缓存直接挂到 /work/tmp/llvm-migration：llvm-host.py 要求产物路径
          # resolve 后仍在仓库内（symlink 指到宿主绝对路径会触发 relative_to 断言）。
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          mount=""
          if [ -d "$cache" ]; then mount="-v $cache:/work/tmp/llvm-migration"; fi
          container run --rm -m 3G -v "$PWD":/work -w /work $mount \
            -e LLVM_JOBS \
            yh-ci:ubuntu24 bash -lc '
              set -euo pipefail
              make bootstrap
              make test-llvm-linux-arm64
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(nproc)"
              make test-toml
              make test-toml-conformance
              make test-toml-injection
              make test-toml-install
              make selfhost-native SKIP_CORPUS=1
            '

  linux-x86_64:
    runs-on: macos-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.YH_GITHUB_TOKEN }}
      YH_LLVM_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 取种子（宿主；容器内 DNS 不通，取种不放容器）
        run: python3 tools/fetch-release-seed.py --platform linux-x86_64 --repo "$SEED_REPO"
      - name: 确保 CI 镜像（amd64 模拟）
        run: |
          set -euo pipefail
          if ! container image list | grep -qE '^yh-ci[[:space:]]+ubuntu24-amd64[[:space:]]'; then
            container build -a amd64 -t yh-ci:ubuntu24-amd64 -f .gitea/ci/Dockerfile .
          fi
      - name: 容器内构建与测试（Linux/x86_64 模拟）
        run: |
          set -euo pipefail
          # 缓存挂到仓库内固定路径：llvm-host.py 要求产物路径 resolve 后仍在仓库内。
          rm -rf tmp/llvm-migration
          cache="${YH_LLVM_CACHE:-$HOME/Documents/x/tmp/llvm-migration}"
          mount=""
          if [ -d "$cache" ]; then mount="-v $cache:/work/tmp/llvm-migration"; fi
          container run --rm -m 3G -a amd64 -v "$PWD":/work -w /work $mount \
            -e LLVM_JOBS -e YH_EMULATED=1 \
            yh-ci:ubuntu24-amd64 bash -lc '
              set -euo pipefail
              make bootstrap
              # 模拟环境下跑与 arm64 同级的门（不做 test-llvm 的 O0/O2 双份重跑，
              # 控制耗时；O2 与 build-check 由真机发布门覆盖）。
              python3 tests/yh/check.py --compiler --compiler-path "$PWD/yh" --quiet
              python3 tests/yh-run/check.py --compiler "$PWD/yh" --quiet --jobs "$(nproc)"
              python3 tests/modules/check.py --compiler-path "$PWD/yh" --quiet
              make selfhost-native SKIP_CORPUS=1
            '
