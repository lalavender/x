name: probe
# Gitea Actions 探针：验证 yh-local runner（host 模式）与 actions/checkout 可用性。
on: [push]
jobs:
  # 探环境：把宿主上的实际 PATH/工作目录写成报告文件，便于在宿主机上核对。
  env-probe:
    runs-on: macos-arm64
    steps:
      - name: 环境探针
        run: |
          set -euo pipefail
          {
            uname -a
            echo "workspace=${GITHUB_WORKSPACE:-<unset>}"
            echo "pwd=$(pwd)"
            echo "runner_os=${RUNNER_OS:-<unset>} runner_arch=${RUNNER_ARCH:-<unset>}"
            echo "path=${PATH}"
            echo "make=$(command -v make) python3=$(command -v python3) git=$(command -v git) cc=$(command -v cc)"
            python3 -V
            make --version | head -1
            ls -a
          } | tee /opt/homebrew/var/gitea-runner/probe-report.txt

  # 真 checkout：验证 actions/checkout 能从 GitHub 拉到本 runner 并 clone 本仓库。
  checkout-probe:
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: 校验检出
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short | head -5
          ls | head -10
          test -f Makefile && echo "Makefile ok"
