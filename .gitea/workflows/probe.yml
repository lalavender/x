name: probe
# Gitea Actions 最小探针：验证 yh-local runner（host 模式）能否接单并执行。
on: [push]
jobs:
  probe:
    runs-on: macos-arm64
    steps:
      - name: 环境探针
        run: |
          set -euo pipefail
          uname -a
          echo "workspace=${GITHUB_WORKSPACE:-<unset>}"
          pwd
          ls -a
          which make python3 git cc
          python3 -V
          make --version | head -1
