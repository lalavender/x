[project]
os = "host"
arch = "host"
name = "linkgroups"
source = "."

[link]
a = ["lib/liba.a"]
b = ["lib/libb.a"]

# 目标表同名组整体替换公共组；extra 是新组，追加到末尾。
[link-darwin-arm64]
a = ["lib/liba_target.a"]
extra = ["lib/libextra.a"]

[link-darwin-x64]
a = ["lib/liba_target.a"]
extra = ["lib/libextra.a"]

[link-linux-arm64]
a = ["lib/liba_target.a"]
extra = ["lib/libextra.a"]

[link-linux-x64]
a = ["lib/liba_target.a"]
extra = ["lib/libextra.a"]
